name: Notify SNS

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub environment name for environment-scoped secrets'
        required: false
        type: string
      type:
        description: 'Type of notification (info, warning, alarm, emergency)'
        required: true
        type: string
      subject:
        description: 'The subject of the message'
        required: false
        type: string
        default: 'GitHub'
      message:
        description: 'The notification message'
        required: true
        type: string
      message_attributes:
        description: 'Message attributes as YAML or JSON object (supports simple key-value pairs or full SNS attribute definitions)'
        required: false
        type: string
    secrets:
      AWS_ROLE:
        description: 'AWS IAM Role ARN to assume'
        required: true
      AWS_REGION:
        description: 'AWS Region for assume-role and SNS publish'
        required: true
      AWS_SNS_TOPIC_INFO_ARN:
        description: 'SNS Topic ARN for info notifications'
        required: false
      AWS_SNS_TOPIC_WARNING_ARN:
        description: 'SNS Topic ARN for warning notifications'
        required: false
      AWS_SNS_TOPIC_ALARM_ARN:
        description: 'SNS Topic ARN for alarm notifications'
        required: false
      AWS_SNS_TOPIC_EMERGENCY_ARN:
        description: 'SNS Topic ARN for emergency notifications'
        required: false

jobs:
  notify:
    name: Notify SNS Topic
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish message to SNS
        env:
          TOPIC_INFO: ${{ secrets.AWS_SNS_TOPIC_INFO_ARN }}
          TOPIC_WARNING: ${{ secrets.AWS_SNS_TOPIC_WARNING_ARN }}
          TOPIC_ALARM: ${{ secrets.AWS_SNS_TOPIC_ALARM_ARN }}
          TOPIC_EMERGENCY: ${{ secrets.AWS_SNS_TOPIC_EMERGENCY_ARN }}
          NOTIFICATION_TYPE: ${{ inputs.type }}
          NOTIFICATION_MESSAGE: ${{ inputs.message }}
          NOTIFICATION_SUBJECT: ${{ inputs.subject }}
          NOTIFICATION_MESSAGE_ATTRIBUTES: ${{ inputs.message_attributes }}
        run: |
          TYPE=$(echo "$NOTIFICATION_TYPE" | tr '[:lower:]' '[:upper:]')
          case "$TYPE" in
            INFO) TOPIC_ARN="$TOPIC_INFO" ;;
            WARNING) TOPIC_ARN="$TOPIC_WARNING" ;;
            ALARM) TOPIC_ARN="$TOPIC_ALARM" ;;
            EMERGENCY) TOPIC_ARN="$TOPIC_EMERGENCY" ;;
            *)
              echo "::error::Invalid notification type specified: $NOTIFICATION_TYPE (must be one of: info, warning, alarm, emergency)"
              exit 1
              ;;
          esac

          if [ -z "$TOPIC_ARN" ]; then
            echo "::error::SNS Topic ARN for type '$TYPE' is not configured."
            exit 1
          fi

          CMD=(aws sns publish --topic-arn "$TOPIC_ARN" --message "$NOTIFICATION_MESSAGE" --subject "$NOTIFICATION_SUBJECT")

          if [ -n "$NOTIFICATION_MESSAGE_ATTRIBUTES" ]; then
            ATTR_JSON=$(python3 -c "import sys, json, yaml; data = yaml.safe_load(sys.stdin.read()) or {}; sys.exit('Message attributes must be an object') if not isinstance(data, dict) else None; formatted = {k: ({'DataType': v.get('DataType') or v.get('data_type', 'String'), **({'StringValue': str(v.get('StringValue') or v.get('string_value') or v.get('value'))} if (v.get('StringValue') or v.get('string_value') or v.get('value')) is not None else {}), **({'BinaryValue': str(v.get('BinaryValue') or v.get('binary_value'))} if (v.get('BinaryValue') or v.get('binary_value')) is not None else {})} if isinstance(v, dict) else {'DataType': 'String', 'StringValue': str(v)}) for k, v in data.items()}; print(json.dumps(formatted))" <<< "$NOTIFICATION_MESSAGE_ATTRIBUTES")
            CMD+=(--message-attributes "$ATTR_JSON")
          fi

          echo "Publishing notification of type $TYPE to SNS topic..."
          "${CMD[@]}"
