name: Perform ECS Release

on:
  workflow_call:
    inputs:
      environment:
        description: 'The environment being deployed to'
        required: true
        type: string
      aws_account_id:
        description: 'The AWS account ID of the cluster'
        required: true
        type: string
      aws_region:
        description: 'The AWS region of the cluster'
        required: true
        type: string
      ecs_cluster:
        description: 'The ECS cluster name or ARN to deploy to (optional if ecs_cluster_name_tag is provided). Supports {aws_region}, {region}, and {environment} template replacements. If a plain name is provided, the full ARN will be constructed using aws_account_id and aws_region.'
        required: false
        type: string
      ecs_cluster_name_tag:
        description: 'The ECS cluster Name tag to search for (optional if ecs_cluster is provided). Supports {region} and {environment} template replacements.'
        required: false
        type: string
      image_sha:
        description: 'The tag (sha) of the built image to release'
        required: true
        type: string
      container_update_tag:
        description: 'The name of the container definition to update'
        required: true
        type: string
      exclude_tag_key:
        description: 'The tag key used to filter out services (e.g. ExcludeFromRelease)'
        required: false
        type: string
      exclude_tag_value:
        description: 'The tag value used to filter out services (e.g. true)'
        required: false
        type: string
      always_exclude_tag_key:
        description: 'The tag key used to always filter out services (e.g. AlwaysExcludeFromRelease)'
        required: false
        type: string
      force_release:
        description: 'Force release even if the service is marked with the ExcludeFromRelease tag'
        required: false
        type: string
        default: 'No'
      update_service:
        description: 'Whether to update the ECS service task definition'
        required: false
        type: boolean
        default: true
      wait_for_stable:
        description: 'Whether to wait for the ECS service to become stable'
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  get-services:
    uses: ./.github/workflows/_aws_get_ecs_services.yaml
    with:
      environment: ${{ inputs.environment }}
      aws_account_id: ${{ inputs.aws_account_id }}
      aws_region: ${{ inputs.aws_region }}
      ecs_cluster: ${{ inputs.ecs_cluster }}
      ecs_cluster_name_tag: ${{ inputs.ecs_cluster_name_tag }}
      exclude_tag_key: ${{ inputs.exclude_tag_key }}
      exclude_tag_value: ${{ inputs.exclude_tag_value }}
      always_exclude_tag_key: ${{ inputs.always_exclude_tag_key }}
      force_release: ${{ inputs.force_release }}
    secrets: inherit

  deploy:
    needs: get-services
    name: deploy
    if: ${{ needs.get-services.outputs.services != '[]' && needs.get-services.outputs.services != '' }}
    uses: ./.github/workflows/_aws_update_ecs_services.yaml
    with:
      environment: ${{ inputs.environment }}
      aws_region: ${{ inputs.aws_region }}
      ecs_cluster: ${{ needs.get-services.outputs.resolved_cluster }}
      ecs_services: ${{ needs.get-services.outputs.services }}
      excluded_services: ${{ needs.get-services.outputs.excluded_services }}
      image_sha: ${{ inputs.image_sha }}
      container_update_tag: ${{ inputs.container_update_tag }}
      update_service: ${{ inputs.update_service }}
      wait_for_stable: ${{ inputs.wait_for_stable }}
    secrets: inherit