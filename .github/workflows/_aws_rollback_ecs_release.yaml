name: Rollback ECS Release

on:
  workflow_call:
    inputs:
      environment:
        description: 'The environment being deployed to'
        required: true
        type: string
      aws_account_id:
        description: 'The AWS account ID of the cluster'
        required: true
        type: string
      aws_region:
        description: 'The AWS region of the cluster'
        required: true
        type: string
      ecs_cluster:
        description: 'The ECS cluster name or ARN to rollback (optional if ecs_cluster_name_tag is provided). Supports {aws_region}, {region}, and {environment} template replacements. If a plain name is provided, the full ARN will be constructed using aws_account_id and aws_region.'
        required: false
        type: string
      ecs_cluster_name_tag:
        description: 'The ECS cluster Name tag to search for (optional if ecs_cluster is provided). Supports {region} and {environment} template replacements.'
        required: false
        type: string
      exclude_tag_key:
        description: 'The tag key used to filter out services (e.g. ExcludeFromRelease)'
        required: false
        type: string
      exclude_tag_value:
        description: 'The tag value used to filter out services (e.g. true)'
        required: false
        type: string
      always_exclude_tag_key:
        description: 'The tag key used to always filter out services (e.g. AlwaysExcludeFromRelease)'
        required: false
        type: string
      force_release:
        description: 'Force rollback even if the service is marked with the ExcludeFromRelease tag'
        required: false
        type: string
        default: 'No'
      rollback_task_definition_arns:
        description: 'Optional JSON object map of service->taskDefinitionArn to rollback to. If not provided for a service, rollback_revisions is used to resolve the target revision.'
        required: false
        type: string
        default: '{}'
      rollback_revisions:
        description: 'Number of task definition revisions to roll back when rollback_task_definition_arns is not provided for a service.'
        required: false
        type: number
        default: 1
      wait_for_stable:
        description: 'Whether to wait for ECS services to become stable after rollback'
        required: false
        type: boolean
        default: true
      deployment_controller:
        description: 'Rollback strategy: ecs (direct ECS update-service) or codedeploy (ECS blue/green via CodeDeploy)'
        required: false
        type: string
        default: 'ecs'
      code_deploy_app_name:
        description: 'The CodeDeploy application name when deployment_controller=codedeploy. Supports {aws_region} and {region} template replacements.'
        required: false
        type: string
      code_deploy_group_name:
        description: 'The CodeDeploy deployment group name when deployment_controller=codedeploy. Supports {aws_region} and {region} template replacements.'
        required: false
        type: string
      code_deploy_s3_bucket:
        description: 'S3 bucket for AppSpec files when deployment_controller=codedeploy. Supports {aws_region} and {region} template replacements.'
        required: false
        type: string
      code_deploy_s3_key_prefix:
        description: 'S3 key prefix for AppSpec files when deployment_controller=codedeploy.'
        required: false
        type: string
        default: 'github/'
    outputs:
      rolled_back_task_definition_arns:
        description: 'JSON stringified object map of service->rolled back task definition ARN'
        value: ${{ jobs.rollback.outputs.rolled_back_task_definition_arns }}

permissions:
  id-token: write
  contents: read

jobs:
  get-services:
    uses: ./.github/workflows/_aws_get_ecs_services.yaml
    with:
      environment: ${{ inputs.environment }}
      aws_account_id: ${{ inputs.aws_account_id }}
      aws_region: ${{ inputs.aws_region }}
      ecs_cluster: ${{ inputs.ecs_cluster }}
      ecs_cluster_name_tag: ${{ inputs.ecs_cluster_name_tag }}
      exclude_tag_key: ${{ inputs.exclude_tag_key }}
      exclude_tag_value: ${{ inputs.exclude_tag_value }}
      always_exclude_tag_key: ${{ inputs.always_exclude_tag_key }}
      force_release: ${{ inputs.force_release }}
    secrets: inherit

  rollback:
    needs: get-services
    if: ${{ needs.get-services.outputs.services != '[]' && needs.get-services.outputs.services != '' }}
    runs-on: ${{ vars.DEFAULT_RUNNER }}
    environment: ${{ inputs.environment }}
    outputs:
      rolled_back_task_definition_arns: ${{ steps.rollback-services.outputs.rolled_back_task_definition_arns }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ secrets.AWS_ROLE }}

      - name: Rollback ECS Services
        id: rollback-services
        run: |
          SERVICES_JSON='${{ needs.get-services.outputs.services }}'
          EXCLUDED_JSON='${{ needs.get-services.outputs.excluded_services }}'
          ROLLBACK_MAP_JSON='${{ inputs.rollback_task_definition_arns }}'
          ROLLBACK_REVISIONS='${{ inputs.rollback_revisions }}'
          CLUSTER='${{ needs.get-services.outputs.resolved_cluster }}'
          WAIT_FOR_STABLE='${{ inputs.wait_for_stable }}'
          DEPLOYMENT_CONTROLLER='${{ inputs.deployment_controller }}'
          CODE_DEPLOY_APP_NAME=$(echo '${{ inputs.code_deploy_app_name }}' | sed 's/{aws_region}/${{ inputs.aws_region }}/g' | sed 's/{region}/${{ inputs.aws_region }}/g')
          CODE_DEPLOY_GROUP_NAME=$(echo '${{ inputs.code_deploy_group_name }}' | sed 's/{aws_region}/${{ inputs.aws_region }}/g' | sed 's/{region}/${{ inputs.aws_region }}/g')
          CODE_DEPLOY_S3_BUCKET=$(echo '${{ inputs.code_deploy_s3_bucket }}' | sed 's/{aws_region}/${{ inputs.aws_region }}/g' | sed 's/{region}/${{ inputs.aws_region }}/g')
          CODE_DEPLOY_S3_KEY_PREFIX='${{ inputs.code_deploy_s3_key_prefix }}'

          if ! echo "$SERVICES_JSON" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "Error: ecs_services must be a valid JSON array."
            exit 1
          fi

          if ! echo "$ROLLBACK_MAP_JSON" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "Error: rollback_task_definition_arns must be a valid JSON object map."
            exit 1
          fi

          if ! echo "$ROLLBACK_REVISIONS" | grep -Eq '^[0-9]+$'; then
            echo "Error: rollback_revisions must be a positive integer."
            exit 1
          fi

          if [ "$ROLLBACK_REVISIONS" -lt 1 ]; then
            echo "Error: rollback_revisions must be greater than or equal to 1."
            exit 1
          fi

          if [ "$DEPLOYMENT_CONTROLLER" != "ecs" ] && [ "$DEPLOYMENT_CONTROLLER" != "codedeploy" ]; then
            echo "Error: deployment_controller must be either 'ecs' or 'codedeploy'."
            exit 1
          fi

          if [ "$DEPLOYMENT_CONTROLLER" = "codedeploy" ] && [ -z "$CODE_DEPLOY_S3_BUCKET" ]; then
            echo "Error: code_deploy_s3_bucket is required when deployment_controller=codedeploy."
            exit 1
          fi

          if [ "$DEPLOYMENT_CONTROLLER" = "codedeploy" ] && [ -z "$CODE_DEPLOY_APP_NAME" ]; then
            echo "Error: code_deploy_app_name is required when deployment_controller=codedeploy."
            exit 1
          fi

          if [ "$DEPLOYMENT_CONTROLLER" = "codedeploy" ] && [ -z "$CODE_DEPLOY_GROUP_NAME" ]; then
            echo "Error: code_deploy_group_name is required when deployment_controller=codedeploy."
            exit 1
          fi

          if [ "$DEPLOYMENT_CONTROLLER" = "codedeploy" ]; then
            APP_NAME_CHECK=$(aws deploy get-application \
              --region "${{ inputs.aws_region }}" \
              --application-name "$CODE_DEPLOY_APP_NAME" \
              --query 'application.applicationName' \
              --output text 2>/dev/null || echo "")

            if [ -z "$APP_NAME_CHECK" ] || [ "$APP_NAME_CHECK" = "None" ]; then
              echo "Error: Provided CodeDeploy application '$CODE_DEPLOY_APP_NAME' was not found in region ${{ inputs.aws_region }}."
              exit 1
            fi

            GROUP_NAME_CHECK=$(aws deploy get-deployment-group \
              --region "${{ inputs.aws_region }}" \
              --application-name "$CODE_DEPLOY_APP_NAME" \
              --deployment-group-name "$CODE_DEPLOY_GROUP_NAME" \
              --query 'deploymentGroupInfo.deploymentGroupName' \
              --output text 2>/dev/null || echo "")

            if [ -z "$GROUP_NAME_CHECK" ] || [ "$GROUP_NAME_CHECK" = "None" ]; then
              echo "Error: Provided CodeDeploy deployment group '$CODE_DEPLOY_GROUP_NAME' was not found for application '$CODE_DEPLOY_APP_NAME' in region ${{ inputs.aws_region }}."
              exit 1
            fi
          fi

          TMP_DIR=$(mktemp -d)
          OUTPUT_FILE="$TMP_DIR/rollback_outputs.txt"
          touch "$OUTPUT_FILE"

          rollback_single_service() {
            local SERVICE="$1"

            echo "=== Rolling back service: $SERVICE ==="

            IS_EXCLUDED=false
            if echo "$EXCLUDED_JSON" | jq -e --arg svc "$SERVICE" '. | contains([$svc])' >/dev/null 2>&1; then
              IS_EXCLUDED=true
            fi

            if [ "$IS_EXCLUDED" = "true" ]; then
              echo "Skipping rollback for service $SERVICE due to exclusion filters."
              return 0
            fi

            TARGET_TASK_DEF=$(echo "$ROLLBACK_MAP_JSON" | jq -r --arg svc "$SERVICE" '.[$svc] // empty')

            CURRENT_TASK_DEF=$(aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --query 'services[0].taskDefinition' \
              --output text)

            if [ -z "$CURRENT_TASK_DEF" ] || [ "$CURRENT_TASK_DEF" = "None" ]; then
              echo "Error: Could not retrieve current task definition for service $SERVICE"
              return 1
            fi

            if [ -z "$TARGET_TASK_DEF" ]; then
              FAMILY_NAME=$(echo "$CURRENT_TASK_DEF" | awk -F'/' '{print $2}' | cut -d':' -f1)
              if [ -z "$FAMILY_NAME" ]; then
                echo "Error: Could not resolve task definition family from $CURRENT_TASK_DEF"
                return 1
              fi

              TASK_DEFS_JSON=$(aws ecs list-task-definitions \
                --family-prefix "$FAMILY_NAME" \
                --status ACTIVE \
                --sort DESC \
                --query 'taskDefinitionArns' \
                --output json)

              TARGET_TASK_DEF=$(echo "$TASK_DEFS_JSON" | jq -r --arg current "$CURRENT_TASK_DEF" --argjson steps "$ROLLBACK_REVISIONS" '
                . as $defs |
                (index($current)) as $idx |
                if $idx == null then
                  (if ($defs | length) > $steps then $defs[$steps] else empty end)
                else
                  (if ($defs | length) > ($idx + $steps) then $defs[$idx + $steps] else empty end)
                end
              ')

              if [ -z "$TARGET_TASK_DEF" ]; then
                echo "Error: Could not resolve rollback target for service $SERVICE using rollback_revisions=$ROLLBACK_REVISIONS (current: $CURRENT_TASK_DEF)."
                return 1
              fi

              echo "Auto-resolved rollback target for $SERVICE using rollback_revisions=$ROLLBACK_REVISIONS: $TARGET_TASK_DEF"
            else
              echo "Using provided rollback target for $SERVICE: $TARGET_TASK_DEF"
            fi

            if [ "$TARGET_TASK_DEF" = "$CURRENT_TASK_DEF" ]; then
              echo "Service $SERVICE is already on target task definition; skipping update."
              echo "$SERVICE=$TARGET_TASK_DEF" >> "$OUTPUT_FILE"
              return 0
            fi

            if [ "$DEPLOYMENT_CONTROLLER" = "codedeploy" ]; then
              echo "Rolling back service $SERVICE via CodeDeploy blue/green..."

              SERVICE_DESC_JSON=$(aws ecs describe-services \
                --cluster "$CLUSTER" \
                --services "$SERVICE" \
                --query 'services[0]' \
                --output json)

              CONTAINER_NAME=$(echo "$SERVICE_DESC_JSON" | jq -r '.loadBalancers[0].containerName // empty')
              CONTAINER_PORT=$(echo "$SERVICE_DESC_JSON" | jq -r '.loadBalancers[0].containerPort // empty')

              if [ -z "$CONTAINER_NAME" ] || [ -z "$CONTAINER_PORT" ]; then
                echo "Error: Could not resolve load balancer container mapping for service $SERVICE required by CodeDeploy AppSpec."
                return 1
              fi

              # MATCHES_SERVICE=$(aws deploy get-deployment-group \
              #   --region "${{ inputs.aws_region }}" \
              #   --application-name "$CODE_DEPLOY_APP_NAME" \
              #   --deployment-group-name "$CODE_DEPLOY_GROUP_NAME" \
              #   --query "length(deploymentGroupInfo.ecsServices[?clusterName=='$CLUSTER' && serviceName=='$SERVICE'])" \
              #   --output text 2>/dev/null || echo "0")

              # if [ "$MATCHES_SERVICE" = "0" ]; then
              #   echo "Error: CodeDeploy deployment group '$CODE_DEPLOY_GROUP_NAME' in app '$CODE_DEPLOY_APP_NAME' is not mapped to service $SERVICE in cluster $CLUSTER."
              #   return 1
              # fi

              SERVICE_SAFE=$(echo "$SERVICE" | tr '/:' '__')
              APPSPEC_FILE="$TMP_DIR/appspec-$SERVICE_SAFE.json"
              S3_KEY="${CODE_DEPLOY_S3_KEY_PREFIX}rollback/${{ github.run_id }}/${SERVICE_SAFE}-${{ github.run_attempt }}.json"

              jq -n \
                --arg taskDef "$TARGET_TASK_DEF" \
                --arg containerName "$CONTAINER_NAME" \
                --argjson containerPort "$CONTAINER_PORT" \
                '{
                  version: "0.0",
                  Resources: [
                    {
                      TargetService: {
                        Type: "AWS::ECS::Service",
                        Properties: {
                          TaskDefinition: $taskDef,
                          LoadBalancerInfo: {
                            ContainerName: $containerName,
                            ContainerPort: $containerPort
                          }
                        }
                      }
                    }
                  ]
                }' > "$APPSPEC_FILE"

              aws s3 cp "$APPSPEC_FILE" "s3://$CODE_DEPLOY_S3_BUCKET/$S3_KEY"

              DEPLOYMENT_ID=$(aws deploy create-deployment \
                --region "${{ inputs.aws_region }}" \
                --application-name "$CODE_DEPLOY_APP_NAME" \
                --deployment-group-name "$CODE_DEPLOY_GROUP_NAME" \
                --revision "{\"revisionType\": \"S3\", \"s3Location\": {\"bucket\": \"$CODE_DEPLOY_S3_BUCKET\", \"key\": \"$S3_KEY\", \"bundleType\": \"JSON\"}}" \
                --query 'deploymentId' \
                --output text)

              if [ -z "$DEPLOYMENT_ID" ] || [ "$DEPLOYMENT_ID" = "None" ]; then
                echo "Error: Failed to create CodeDeploy rollback deployment for service $SERVICE."
                return 1
              fi

              echo "Created CodeDeploy rollback deployment for $SERVICE: $DEPLOYMENT_ID"

              if [ "$WAIT_FOR_STABLE" = "true" ]; then
                aws deploy wait deployment-successful \
                  --region "${{ inputs.aws_region }}" \
                  --deployment-id "$DEPLOYMENT_ID"
                echo "CodeDeploy deployment $DEPLOYMENT_ID for service $SERVICE succeeded."
              fi
            else
              aws ecs update-service \
                --cluster "$CLUSTER" \
                --service "$SERVICE" \
                --task-definition "$TARGET_TASK_DEF"

              if [ "$WAIT_FOR_STABLE" = "true" ]; then
                echo "Waiting for service $SERVICE to become stable..."
                aws ecs wait services-stable \
                  --cluster "$CLUSTER" \
                  --services "$SERVICE"
                echo "Service $SERVICE is stable."
              fi
            fi

            echo "$SERVICE=$TARGET_TASK_DEF" >> "$OUTPUT_FILE"
          }

          PIDS=()
          for SERVICE in $(echo "$SERVICES_JSON" | jq -r '.[]'); do
            rollback_single_service "$SERVICE" &
            PIDS+=($!)
          done

          FAILURES=0
          for PID in "${PIDS[@]}"; do
            wait "$PID" || FAILURES=$((FAILURES + 1))
          done

          if [ $FAILURES -gt 0 ]; then
            echo "Error: $FAILURES service rollback(s) failed."
            exit 1
          fi

          ROLLED_BACK_JSON="{}"
          if [ -s "$OUTPUT_FILE" ]; then
            ROLLED_BACK_JSON=$(jq -n -R '[inputs | split("=")] | map({key: .[0], value: .[1]}) | from_entries' "$OUTPUT_FILE")
          fi

          COMPACT_ROLLED_BACK=$(echo "$ROLLED_BACK_JSON" | jq -c '.')
          echo "rolled_back_task_definition_arns=$COMPACT_ROLLED_BACK" >> $GITHUB_OUTPUT
